<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": {{ site.author | jsonify }},
      "url": {{ site.url | jsonify }},
      "image": {{ site.logo | absolute_url | jsonify }},
      "jobTitle": {{ site.role | jsonify }},
      "affiliation": {
        "@type": "CollegeOrUniversity",
        "name": "University of Maryland, College Park",
        "department": { "@type": "Organization", "name": {{ site.department | jsonify }} }
      },
      "alumniOf": { "@type": "CollegeOrUniversity", "name": "Dartmouth College" },
      "knowsAbout": ["Public finance", "Urban economics", "Property taxation", "Housing"],
      "sameAs": {{ site.profiles | map: "url" | jsonify }}
    }
    </script>
    <link rel="icon" href="{{ '/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    {{ content }}
  </body>
</html>
